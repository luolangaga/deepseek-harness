# electron-builder packaging for @deepseek-ai/dsh-desktop.
# The workspace denies electron-winstaller (Squirrel.Windows): Windows ships NSIS.
appId: com.deepseek.harness.desktop
productName: DeepSeek Harness
directories:
  output: dist
  buildResources: build
files:
  - lib/**
  - config/**
  - package.json
# The harness resolves plugins, profile bundles, and client bundles from real
# files at runtime (module healing symlinks into node_modules), so the whole
# dependency closure must live unpacked.
asarUnpack:
  - node_modules/**
# No native modules in this app's closure; a rebuild pass only slows packaging.
npmRebuild: false
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development

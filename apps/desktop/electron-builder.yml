# electron-builder packaging for @deepseek-ai/dsh-desktop.
# The workspace denies electron-winstaller (Squirrel.Windows): Windows ships NSIS.
appId: com.deepseek.harness.desktop
productName: DeepSeek Harness
directories:
  output: dist
  buildResources: build
files:
  - lib/**
  - config/**
  - package.json
# The harness resolves plugins, profile bundles, and client bundles from real
# files at runtime: the boot heals $DSH_HOME/profiles/node_modules with
# junctions at the app's dependency tree, and Windows junctions cannot
# traverse into an asar (a file). Everything ships unpacked.
asar: false
# No native modules in this app's closure; a rebuild pass only slows packaging.
npmRebuild: false
# The DeepSeek whale mark (build/icon.svg, rasterized by `pnpm run build:icon`);
# electron-builder derives the platform .ico/.icns from the single PNG.
win:
  icon: build/icon.png
  target:
    - nsis
    # The green/portable build: a zip of the unpacked app, extract and run.
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  icon: build/icon.png
  target:
    - dmg
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development

# Desktop release: on a v* tag push, build the macOS dmg and the Windows
# NSIS installer and attach both to the GitHub Release for that tag.
# No code signing on CI (no identity configured): the macOS build skips
# signing/notarization via CSC_IDENTITY_AUTO_DISCOVERY=false and the Windows
# installer ships unsigned.

name: Desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PRIMARY_NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (dmg)
            os: macos-latest
            artifact: '*.dmg'
          - name: Windows (NSIS + zip)
            os: windows-latest
            artifact: '*.{exe,zip}'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the harness and the desktop shell
        run: |
          pnpm run build
          pnpm --filter @deepseek-ai/dsh-desktop run build

      - name: Package the installer
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --publish never

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "DeepSeek Harness Desktop $GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" apps/desktop/dist/${{ matrix.artifact }} --clobber
